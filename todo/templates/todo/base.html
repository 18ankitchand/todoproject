
<html>
    <head>
   
        <title>Todo App</title>
       <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>
    <body>
        <nav class='navbar navbar-ligth bg-light mb-4'>
            <div class='container'>
                <a class='navbar-brand' href='{% url 'todo:task_list'%}'>Todo App</a>
                {% if user.is_authenticated %}
                    <div class='d-flex align-items-center gap-2'>
                        <a class='btn btn-primary' href='{% url 'todo:task_create'%}'>Add Task</a>
                       
                    </div>
                {% else %}
                    <div class='d-flex gap-2'>
                        <a class='btn btn-primary' href='{% url 'todo:signin' %}'>Sign In</a>
                        <a class='btn btn-outline-primary' href='{% url 'todo:signup' %}'>Sign Up</a>
                    </div>
                {% endif %}
            </div>
        </nav>
        <div class='container'>
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-success alert-dismissible fade show mt-3" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}

            {%block content%}
            {% endblock %}
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    </body>
</html>
